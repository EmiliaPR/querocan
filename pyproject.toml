# Configuración das ferramentas de calidade de QueroCan

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# E/F: erros básicos · I: orde dos imports · B: erros habituais · UP: sintaxe moderna
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "querocan.settings"
python_files = ["test_*.py"]
# Non usamos clases de proba; evita que pytest confunda o modelo «Testemuno» cunha
python_classes = ["Proba*"]
addopts = "--reuse-db -q"

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "*/tests/*", "tests/*", "manage.py", "querocan/wsgi.py"]
