{# Botón «Adoptar»: crea a solicitude (o mesmo ca deslizar á dereita no deck). #}
<form method="post" action="{% url 'adopcions:solicitar' can.pk %}">
  {% csrf_token %}
  <input type="hidden" name="volver" value="{{ request.get_full_path }}">
  <button type="submit" class="boton boton--primario boton--pequeno">Adoptar</button>
</form>
